<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location Link Generator</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182033}.wrap{max-width:620px;margin:8vh auto;padding:24px}.card{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #ccd2dd;font-size:16px;margin:7px 0}button{background:#111827;color:#fff;border:0;cursor:pointer}.result{display:none;margin-top:20px;padding:15px;background:#eef7ee;border-radius:10px;word-break:break-all}small{color:#667085}</style></head><body><div class="wrap"><div class="card"><h1>Create a location link</h1><p>Generate a consent-based link for a meeting guest. They must tap <b>Allow</b> when their browser asks for location access.</p><label>Label</label><input id="label" value="Meeting location"><label>Link expires after (hours)</label><input id="hours" type="number" min="1" max="168" value="24"><label>Admin key</label><input id="key" type="password" placeholder="Your ADMIN_KEY"><button onclick="create()">Generate link</button><div id="out" class="result"></div><small>Keep your admin key private. This page is intended for your own server.</small></div></div><script>async function create(){const key=document.getElementById('key').value;const r=await fetch('/api/share',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({label:document.getElementById('label').value,hours:document.getElementById('hours').value})});const j=await r.json();if(!r.ok)return alert(j.error||'Could not create link');const url=location.origin+j.url;out.style.display='block';out.innerHTML='<b>Send this link:</b><br><br><a href="'+url+'">'+url+'</a><br><br><button onclick="navigator.clipboard.writeText(\''+url+'\');this.textContent=\'Copied\'">Copy link</button>'}</script></body></html>
