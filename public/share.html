<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share your location</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182033}.wrap{max-width:560px;margin:8vh auto;padding:20px}.card{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0001;text-align:center}button{width:100%;padding:15px;border:0;border-radius:10px;background:#111827;color:white;font-size:17px;cursor:pointer}.status{margin-top:16px;padding:14px;border-radius:10px;background:#f1f3f7}a{display:block;margin-top:15px}</style></head><body><div class="wrap"><div class="card"><h1>Share your location</h1><p>This link was created for a meeting. Your browser will ask for permission to share your device's current location.</p><button id="btn" onclick="share()">Share my location</button><div id="status" class="status">Location is not shared yet.</div><div id="map"></div></div></div><script>const token=location.pathname.split('/').pop();const status=document.getElementById('status');function share(){if(!navigator.geolocation){status.textContent='This browser does not support location sharing.';return}status.textContent='Requesting your location…';navigator.geolocation.getCurrentPosition(async p=>{const {latitude:lat,longitude:lng,accuracy}=p.coords;const r=await fetch('/api/share/'+token+'/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat,lng,accuracy})});const j=await r.json();if(!r.ok){status.textContent=j.error||'Could not share location.';return}status.innerHTML='Location shared successfully. You can close this page.';document.getElementById('map').innerHTML='<a target="_blank" href="https://www.google.com/maps?q='+lat+','+lng+'">Open this location in Google Maps</a>'},e=>{status.textContent='Location permission was not granted or the location could not be obtained. Please allow location access and try again.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}</script></body></html>
